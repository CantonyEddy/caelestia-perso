# TEMPLATE caelestia — rendu par `apply_user_templates` à chaque scheme.
# GÉNÉRÉ par scripts/gen-starship.py — ne pas éditer à la main (édite le script).
# Capsules connectées, dégradé bord(foncé)→centre(clair) via rôles Material You.

add_newline = false
continuation_prompt = "[▸▹ ](dimmed white)"

format = "$os$directory$cmd_duration$fill$status$git_status$git_branch$time$line_break$character"

[fill]
symbol = "═"
style = "fg:#{{ primaryContainer.hex }}"

[character]
success_symbol = "[❯](bold #{{ primary.hex }})"
error_symbol = "[❯](bold #{{ error.hex }})"
vimcmd_symbol = "[❯](bold #{{ primaryContainer.hex }})"

# ── Gauche : OS(c1 foncé) → dossier(c2) → durée(c3 clair) ──
[os]
disabled = false
format = "[](fg:#{{ onPrimary.hex }})[ $symbol ](fg:#{{ onPrimaryContainer.hex }} bg:#{{ onPrimary.hex }})"
[os.symbols]
Arch = ""
Linux = ""

[directory]
home_symbol = "~"
truncation_length = 3
truncation_symbol = "…/"
read_only = " "
use_os_path_sep = true
format = "[](fg:#{{ onPrimary.hex }} bg:#{{ primaryContainer.hex }})[  $path$read_only ](fg:#{{ onPrimaryContainer.hex }} bg:#{{ primaryContainer.hex }})"

[cmd_duration]
min_time = 0
show_milliseconds = true
format = "[](fg:#{{ primaryContainer.hex }} bg:#{{ primary.hex }})[  $duration ](fg:#{{ onPrimary.hex }} bg:#{{ primary.hex }})[](fg:#{{ primary.hex }})"

# ── Droite : (user(status(branch+logo(heure) en dépôt, (user(heure) sinon ──
# Chaque segment « mord » dans le précédent : CAP_L, SA couleur SUR le fond du
# précédent. username = ANCRE permanente (c2, même couleur que la branche) → le
# `(` de jonction de l'heure (c1 sur c2) est STATIQUE et marche dans les 2 cas.
# git_status/git_branch sont optionnels (disparaissent hors dépôt).
[git_status]
format = "[](fg:#{{ primary.hex }} bg:#{{ primaryContainer.hex }})[ $all_status$ahead_behind ](fg:#{{ onPrimary.hex }} bg:#{{ primary.hex }})"
conflicted = "!"
ahead = "⇡$count"
behind = "⇣$count"
diverged = "⇕⇡$ahead_count⇣$behind_count"
untracked = "?"
stashed = "≡"
modified = "●"
staged = "+$count"
renamed = "»"
deleted = "✘"

[git_branch]
only_attached = false
format = "[](fg:#{{ primaryContainer.hex }} bg:#{{ primary.hex }})[  $branch ](fg:#{{ onPrimaryContainer.hex }} bg:#{{ primaryContainer.hex }})"
symbol = ""
truncation_length = 20
truncation_symbol = "…"

# status : ANCRE permanente. disabled=false + success_symbol → s'affiche AUSSI
# en succès (pas seulement sur erreur). Couleur branche (c2) → jonction statique
# de l'heure. ✓ = succès, ✗ + code = échec de la dernière commande.
[status]
disabled = false
format = "[](fg:#{{ primaryContainer.hex }})[ $symbol$maybe_int ](fg:#{{ onPrimaryContainer.hex }} bg:#{{ primaryContainer.hex }})"
success_symbol = "✓"
symbol = "✗ "
[time]
disabled = false
format = "[](fg:#{{ onPrimary.hex }} bg:#{{ primaryContainer.hex }})[  $time ](fg:#{{ onPrimaryContainer.hex }} bg:#{{ onPrimary.hex }})[](fg:#{{ onPrimary.hex }})"
time_format = "%R"
utc_time_offset = "local"
