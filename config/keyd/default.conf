# default.conf — remap clavier bas-niveau via keyd (https://github.com/rvaiya/keyd)
# Déployé dans /etc/keyd/ par install.sh (copie via sudo).
#
# But : couche "HYPER" perso pilotée par Caps Lock, sans casser Verr.Maj.
#   * Caps Lock tap        -> Verr.Maj (comportement normal)
#   * Caps Lock maintenu+X -> couche [hyper] : émet une F-key liée dans Hyprland
#
# keyd n'a pas de vrai modificateur "Hyper", donc on route Caps+lettre vers des
# F-keys (F13+) qu'aucun clavier physique n'émet -> zéro conflit. Les actions
# elles-mêmes sont définies côté Hyprland (hypr/user/keybinds.lua), lancées en
# tant qu'utilisateur (et non root comme le ferait command() de keyd).
#
# NB : keyd ne traite comme commentaires que les lignes ENTIÈRES débutant par #
# (pas de commentaire en fin de ligne dans les bindings).

[ids]
*

[main]
# tap = Verr.Maj ; maintenu = active la couche [hyper]
capslock = overload(hyper, capslock)

[hyper]
# Correspondance lettre (AZERTY) -> F-key, liée aux apps dans keybinds.lua :
#   c -> F13 : Claude Desktop
#   n -> F14 : zennotes
#   t -> F15 : Thunderbird
#   s -> F16 : Signal
#   a -> F17 : keepassxc
c = f13
n = f14
t = f15
s = f16
a = f17
