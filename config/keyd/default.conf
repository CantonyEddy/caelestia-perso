# default.conf — remap clavier bas-niveau via keyd (https://github.com/rvaiya/keyd)
# Déployé dans /etc/keyd/ par install.sh (copie via sudo).
#
# But : couche "HYPER" perso pilotée par Caps Lock, sans casser Verr.Maj.
#   * Caps Lock tap        -> Verr.Maj (comportement normal)
#   * Caps Lock maintenu+X -> couche [hyper] : émet une F-key liée dans Hyprland
#
# keyd n'a pas de vrai modificateur "Hyper", donc on route Caps+lettre vers des
# F-keys (F13+) qu'aucun clavier physique n'émet -> zéro conflit. Les actions
# elles-mêmes sont définies côté Hyprland (hypr/user/keybinds.lua), lancées en
# tant qu'utilisateur (et non root comme le ferait command() de keyd).
#
# NB : keyd ne traite comme commentaires que les lignes ENTIÈRES débutant par #
# (pas de commentaire en fin de ligne dans les bindings).

[ids]
*

[main]
# tap = Verr.Maj ; maintenu = active la couche [hyper]
capslock = overload(hyper, capslock)

[hyper]
# ATTENTION : keyd nomme les touches par leur POSITION PHYSIQUE (noms QWERTY),
# avant la disposition. Les lettres à position identique AZERTY/QWERTY (c,n,t,s)
# s'écrivent pareil. Mais les touches déplacées en AZERTY doivent utiliser leur
# nom de POSITION QWERTY :  A->q , Z->w , Q->a , W->z , M->semicolon.
#
# Touche pressée (AZERTY) -> nom keyd -> F-key -> app (voir keybinds.lua) :
#   C -> c -> F13 : Claude Desktop
#   N -> n -> F14 : zennotes
#   T -> t -> F15 : Thunderbird
#   S -> s -> F16 : Signal
#   A -> q -> F17 : KeePassXC
c = f13
n = f14
t = f15
s = f16
q = f17

# Flèches sous HYPER -> F18-F21 : fusion d'une fenêtre dans le groupe voisin
# (moveintogroup), liées côté Hyprland (keybinds.lua). Les flèches gardent leur
# rôle normal hors couche HYPER.
#   gauche -> F18 / droite -> F19 / haut -> F20 / bas -> F21
left = f18
right = f19
up = f20
down = f21

# Tab sous HYPER -> F22 : navigation entre onglets du groupe (changegroupactive),
# liée côté Hyprland. HYPER + Tab = suivant ; HYPER + Shift + Tab = précédent
# (le Shift reste un modificateur normal, transmis tel quel à Hyprland).
tab = f22
