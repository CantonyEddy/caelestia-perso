# 20-wayland.conf — compositor du greeter Wayland
# Déployé dans /etc/sddm.conf.d/ par install.sh (copie via sudo).
[Wayland]
# Greeter en Lua (Hyprland 0.57 supprime le format .conf). install.sh retombe
# automatiquement sur hyprland-greeter.conf si le .lua n'est pas validé.
CompositorCommand=start-hyprland -- --config /etc/sddm/hyprland-greeter.lua
