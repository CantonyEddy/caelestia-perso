# hyprland-greeter.conf — config Hyprland du greeter SDDM (déployée dans /etc/sddm/).
#
# ⚠️  NE PAS convertir ce fichier en .lua et NE PAS le supprimer.
# Le greeter (lancé par `start-hyprland -- --config .../hyprland-greeter.conf`)
# ne charge PAS correctement un --config en .lua dans ce contexte : retirer ce
# .conf casse le boot (écran noir figé, jamais de SDDM -> restauration de snapshot).
# Le warning de dépréciation « .conf format » de Hyprland est purement cosmétique
# et sans danger jusqu'à Hyprland 0.57. On garde donc ce fichier en .conf.

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = 0x000000
}

input {
    kb_layout = fr
    numlock_by_default = true
}

animations {
    enabled = false
}

decoration {
    blur {
        enabled = false
    }
}
