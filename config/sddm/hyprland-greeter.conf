# hyprland-greeter.conf — config Hyprland du greeter SDDM (déployée dans /etc/sddm/).
#
# ⚠️  NE PAS convertir ce fichier en .lua et NE PAS le supprimer.
# Le greeter (lancé par `start-hyprland -- --config .../hyprland-greeter.conf`)
# ne charge PAS correctement un --config en .lua dans ce contexte : retirer ce
# .conf casse le boot (écran noir figé, jamais de SDDM -> restauration de snapshot).
# Le warning de dépréciation « .conf format » de Hyprland est cosmétique en 0.56.
#
# 🔴 MAIS Hyprland 0.57 SUPPRIME le format .conf (upstream a9902ea6) : ce fichier
# ne chargera plus. Migration préparée dans hyprland-greeter.lua (non déployée) :
# la tester AVANT de passer en 0.57 (procédure : ARCHITECTURE.md § Config SDDM).

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = 0x000000
}

input {
    kb_layout = fr
    numlock_by_default = true
}

animations {
    enabled = false
}

decoration {
    blur {
        enabled = false
    }
}
