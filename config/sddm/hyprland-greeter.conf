# hyprland-greeter.conf — config Hyprland du greeter SDDM (déployée dans /etc/sddm/).
#
# FILET DE SECOURS. La config active est hyprland-greeter.lua (cf. 20-wayland.conf).
# Ce .conf reste déployé dans /etc/sddm/ : install.sh y retombe si le .lua n'est
# pas validé. Ne pas le supprimer de /etc tant que le .lua n'a pas booté.
# Inutilisable à partir de Hyprland 0.57 (format .conf supprimé upstream).
#
# Historique (août 2026) : l'écran noir n'était PAS dû au Lua. install.sh laissait
# un "20-wayland.conf.bak-…" DANS /etc/sddm.conf.d/ ; SDDM lit tous les fichiers de
# ce dossier (sans filtre d'extension, le dernier gagne) -> le greeter tournait en
# fait toujours sur ce .conf ; le supprimer = `--config` vers un fichier absent =
# Hyprland quitte au démarrage. Corrigé : sauvegardes dans /var/backups/.

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = 0x000000
}

input {
    kb_layout = fr
    numlock_by_default = true
}

animations {
    enabled = false
}

decoration {
    blur {
        enabled = false
    }
}
