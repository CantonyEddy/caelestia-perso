# GÉNÉRÉ par scripts/gen-starship.py — ne pas éditer à la main (édite le script).
# Couleurs ANSI (indices de palette remappés par caelestia) -> le prompt se
# recolore en direct au changement de scheme, scrollback inclus. Pas de dégradé
# tonal (palette = couleurs distinctes) : chaque bloc a sa couleur.

add_newline = false
continuation_prompt = "[▸▹ ](dimmed white)"

format = "$os$directory$cmd_duration$fill$status$git_status$git_branch$time$line_break$character"

[fill]
symbol = "━"
style = "fg:16"

[character]
success_symbol = "[❯](bold 17)"
error_symbol = "[❯](bold 1)"
vimcmd_symbol = "[❯](bold 16)"

# ── Gauche : OS(C1) → dossier(C2) → durée(C3), capsule connectée ──
[os]
disabled = false
format = "[](fg:18)[ $symbol ](fg:0 bg:18)"
[os.symbols]
Arch = ""
Linux = ""

[directory]
home_symbol = "~"
truncation_length = 3
truncation_symbol = "…/"
read_only = " "
use_os_path_sep = true
format = "[](fg:18 bg:16)[  $path$read_only ](fg:0 bg:16)"

[cmd_duration]
min_time = 0
show_milliseconds = true
format = "[](fg:16 bg:17)[  $duration ](fg:0 bg:17)[](fg:17)"

# ── Droite : (status(git_status(branch+logo(heure) — status = ancre (C2) ──
[status]
disabled = false
format = "[](fg:16)[ $symbol$maybe_int ](fg:0 bg:16)"
success_symbol = "✓"
symbol = "✗ "

[git_status]
format = "[](fg:17 bg:16)[ $all_status$ahead_behind ](fg:0 bg:17)"
conflicted = "!"
ahead = "⇡$count"
behind = "⇣$count"
diverged = "⇕⇡$ahead_count⇣$behind_count"
untracked = "?"
stashed = "≡"
modified = "●"
staged = "+$count"
renamed = "»"
deleted = "✘"

[git_branch]
only_attached = false
format = "[](fg:16 bg:17)[  $branch ](fg:0 bg:16)"
symbol = ""
truncation_length = 20
truncation_symbol = "…"

[time]
disabled = false
format = "[](fg:18 bg:16)[  $time ](fg:0 bg:18)[](fg:18)"
time_format = "%R"
utc_time_offset = "local"
