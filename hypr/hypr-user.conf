# ~/.config/caelestia/hypr-user.conf
# Aiguilleur : ce fichier est le SEUL que Caelestia source pour tes overrides
# Hyprland. Il source à son tour ta sous-arborescence user/, dans l'ordre
# ci-dessous (l'ordre compte : les dernières déclarations gagnent).
#
# Pour ajouter un thème : crée user/<nom>.conf et ajoute une ligne ici.

$cUser = ~/.config/caelestia/user

source = $cUser/env.conf
source = $cUser/general.conf
source = $cUser/input.conf
source = $cUser/misc.conf
source = $cUser/animations.conf
source = $cUser/decoration.conf
source = $cUser/group.conf
source = $cUser/execs.conf
source = $cUser/rules.conf
source = $cUser/gestures.conf
source = $cUser/keybinds.conf
source = $cUser/scrolling.conf
