# ~/.config/caelestia/hypr-user.conf
# Aiguilleur : ce fichier est le SEUL que Caelestia source pour tes overrides
# Hyprland. Il source à son tour ta sous-arborescence user/, dans l'ordre
# ci-dessous (l'ordre compte : les dernières déclarations gagnent).
#
# Pour ajouter un thème : crée user/<nom>.conf et ajoute une ligne ici.

~/.config/caelestia/user = ~/.config/caelestia/user

source = ~/.config/caelestia/user/env.conf
source = ~/.config/caelestia/user/general.conf
source = ~/.config/caelestia/user/input.conf
source = ~/.config/caelestia/user/misc.conf
source = ~/.config/caelestia/user/animations.conf
source = ~/.config/caelestia/user/decoration.conf
source = ~/.config/caelestia/user/group.conf
source = ~/.config/caelestia/user/execs.conf
source = ~/.config/caelestia/user/rules.conf
source = ~/.config/caelestia/user/gestures.conf
source = ~/.config/caelestia/user/keybinds.conf
source = ~/.config/caelestia/user/scrolling.conf
