# ~/.config/caelestia/hypr-user.conf
# Tes ajouts perso : input, binds, règles, exec-once, monitors...
# Sourcé en TOUT DERNIER par hyprland.conf → tes valeurs gagnent.

# ==========
# Input (clavier FR + touchpad)
# ==========
input {
    kb_layout = fr
    numlock_by_default = true
    repeat_delay = 250
    repeat_rate = 35

    focus_on_close = 1

    touchpad {
        natural_scroll = true
        disable_while_typing = $touchpadDisableTyping
        scroll_factor = $touchpadScrollFactor
    }
}

binds {
    scroll_event_delay = 0
}

cursor {
    hotspot_padding = 1
}

# ==========
# Ajouts perso (décommente / adapte)
# ==========

# --- Nouveaux keybinds ---
