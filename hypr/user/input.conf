# user/input.conf — clavier, souris, touchpad
# Surcharge ce que tu veux ; sourcé après l'input.conf de Caelestia.

input {
    kb_layout = fr, us
    numlock_by_default = true
    repeat_delay = 250
    repeat_rate = 35

    focus_on_close = 1

    touchpad {
        natural_scroll = true
        disable_while_typing = $touchpadDisableTyping
        scroll_factor = $touchpadScrollFactor
    }
}

binds {
    scroll_event_delay = 0
}

cursor {
    hotspot_padding = 1
}
